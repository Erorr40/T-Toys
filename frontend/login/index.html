   if (window.self === window.top) {
  const originMeta = document.querySelector('meta[name="app-origin"]');
  const backendMeta = document.querySelector('meta[name="backend-base-url"]');
  const canonicalLink = document.querySelector('link[rel="canonical"]');
  const ogUrl = document.querySelector('meta[property="og:url"]');
  const twitterUrl = document.querySelector('meta[name="twitter:url"]');
  let appOrigin = originMeta && originMeta.content ? originMeta.content.trim() : "";
  let backendBase = backendMeta && backendMeta.content ? backendMeta.content.trim() : "";
  if (!appOrigin || appOrigin.includes("example")) {
    appOrigin = window.location.origin;
  }
   // Allow overriding backend base URL without rebuilding the frontend.
   // Example: https://<cloudflare-domain>/?backend_base_url=https://monster.asp
   try {
     const qsBackend = new URL(window.location.href).searchParams.get("backend_base_url");
     if (qsBackend) backendBase = qsBackend;
   } catch (e) {}
   if (!backendBase || backendBase.includes("example")) {
     backendBase = appOrigin;
   }
  const normalizedBackendBase = backendBase.replace(/\/+$/, "");
  if (canonicalLink && appOrigin) {
    canonicalLink.href = appOrigin;
  }
  if (ogUrl && appOrigin) {
    ogUrl.setAttribute("content", appOrigin);
  }
  if (twitterUrl && appOrigin) {
    twitterUrl.setAttribute("content", appOrigin);
  }
  let lastPath = "";
  function getPageNameFromPath(path) {
    const segments = path.split("/").filter(Boolean);
    return segments[0] || null;
  }
  function trackPageView() {
    const path = window.location.pathname;
    if (path === lastPath) return;
    lastPath = path;
    const pageName = getPageNameFromPath(path) || "home";
    const appId = "699db9d22942c2facdf17ccb";
    if (!appId) return;
    fetch(`${normalizedBackendBase}/app-logs/${appId}/log-user-in-app/${pageName}`, {
      method: "POST",
    }).catch(() => {});
  }
  const originalPushState = history.pushState.bind(history);
  history.pushState = function (...args) {
    originalPushState(...args);
    trackPageView();
  };
  const originalReplaceState = history.replaceState.bind(history);
  history.replaceState = function (...args) {
    originalReplaceState(...args);
    trackPageView();
  };
  window.addEventListener("popstate", trackPageView);
  trackPageView();
}
  </script>

 <body class="min-h-screen bg-[#FFF9F0]">
  <div class="min-h-screen flex items-center justify-center px-4 py-10">
   <div class="w-full max-w-md bg-white rounded-3xl p-6 shadow-lg">
    <div class="text-center mb-6">
     <h1 class="text-3xl font-black text-gray-800">
      Sign In
     </h1>
     <p class="text-sm text-gray-500">
      Use your email and password to continue.
     </p>
    </div>
    <form class="space-y-4" id="login-form">
     <div>
      <label class="block text-sm font-bold text-gray-600 mb-2" for="login-email">
       Email
      </label>
      <input autocomplete="email" class="w-full px-4 py-3 rounded-2xl border-2 border-gray-100 focus:border-[#FF6B9D] focus:outline-none font-semibold text-gray-800" id="login-email" required="" type="email"/>
     </div>
     <div>
      <label class="block text-sm font-bold text-gray-600 mb-2" for="login-password">
       Password
      </label>
      <input autocomplete="current-password" class="w-full px-4 py-3 rounded-2xl border-2 border-gray-100 focus:border-[#FF6B9D] focus:outline-none font-semibold text-gray-800" id="login-password" required="" type="password"/>
     </div>
     <p class="hidden text-sm text-red-600 font-semibold" id="login-error" role="alert">
     </p>
     <button class="w-full py-3 bg-gradient-to-r from-[#FF6B9D] to-[#A78BFA] text-white font-bold rounded-2xl hover:shadow-lg transition-all" id="login-submit" type="submit">
      Sign In
     </button>
    </form>
    <div class="mt-4">
     <button id="login-google" class="w-full py-3 border-2 border-gray-100 rounded-2xl text-gray-800 font-bold hover:shadow-md">Login with Google</button>
    </div>
    <div class="mt-5 text-center">
     <a class="text-sm font-bold text-[#FF6B9D] hover:underline" href="/" id="login-back">
      Back to home
     </a>
    </div>
    <div class="mt-4 text-center border-t border-gray-200 pt-4">
     <p class="text-sm text-gray-600">
      Don't have an account?
      <a class="font-bold text-[#FF6B9D] hover:underline" href="/signup">
       Sign Up
      </a>
     </p>
    </div>
    <div class="mt-3 text-center">
     <button id="sign-out" class="text-xs text-gray-500 hover:underline">Sign out</button>
    </div>
   </div>
  </div>
  <script>
   (function () {
    var params = new URLSearchParams(window.location.search);
    var appId = params.get("app_id") || "699db9d22942c2facdf17ccb";
    var apiBase = "https://tots-toy-fun.base44.app/api";
    var basePath = window.location.pathname.indexOf("/frontend/") === 0 ? "/frontend/" : "/";
    var fallbackUrl = window.location.origin + basePath;
    var fromParam = params.get("from_url");
    var fromUrl = fallbackUrl;

    if (fromParam) {
      try {
        fromUrl = new URL(fromParam, window.location.origin).toString();
      } catch (e) {
        fromUrl = fallbackUrl;
      }
    }

    var backLink = document.getElementById("login-back");
    if (backLink) {
      backLink.setAttribute("href", fromUrl);
    }

    var form = document.getElementById("login-form");
    var emailInput = document.getElementById("login-email");
    var passwordInput = document.getElementById("login-password");
    var errorEl = document.getElementById("login-error");
    var submitBtn = document.getElementById("login-submit");

    if (!form || !emailInput || !passwordInput || !submitBtn) return;

    var prefillEmail = params.get("prefill_email");
    if (prefillEmail && emailInput) {
      emailInput.value = decodeURIComponent(prefillEmail);
    }

    var googleBtn = document.getElementById("login-google");
    if (googleBtn) {
      googleBtn.addEventListener("click", function (e) {
        e.preventDefault();
        // Use the public app host for the T for Toys app so the button matches the site's behavior.
        var publicAppHost = "https://tots-toy-fun.base44.app";
        try {
          var appBase = new URL(window.location.href).searchParams.get('app_base_url') || window.location.origin;
        } catch (e) {
          var appBase = window.location.origin;
        }
        // Navigate to the app's login page (it will show provider buttons and handle redirects)
        var authUrl = publicAppHost + '/login?from_url=' + encodeURIComponent(appBase);
        window.location.href = authUrl;
      });
    }

    var signOutBtn = document.getElementById("sign-out");
    if (signOutBtn) {
      signOutBtn.addEventListener("click", function (e) {
        e.preventDefault();
        // Navigate to our logout page which will clear localStorage and call platform logout
        var appBase = new URL(window.location.href).searchParams.get('app_base_url') || window.location.origin;
        var logoutPath = basePath === "/frontend/" ? "/frontend/logout" : "/logout";
        window.location.href = logoutPath + '?app_base_url=' + encodeURIComponent(appBase) + '&app_id=' + encodeURIComponent(appId);
      });
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      if (errorEl) {
        errorEl.textContent = "";
        errorEl.classList.add("hidden");
      }

      submitBtn.disabled = true;
      var originalText = submitBtn.textContent;
      submitBtn.textContent = "Signing in...";

      var payload = {
        email: String(emailInput.value || "").trim(),
        password: String(passwordInput.value || "")
      };

      fetch(apiBase + "/apps/" + encodeURIComponent(appId) + "/auth/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify(payload)
      })
        .then(function (response) {
          return response.json().then(function (data) {
            return { ok: response.ok, data: data };
          });
        })
        .then(function (result) {
          if (!result.ok) {
            var message = (result.data && (result.data.message || result.data.detail)) || "Login failed.";
            throw new Error(message);
          }

          var token = result.data && result.data.access_token;
          if (!token) {
            throw new Error("Login succeeded but no access token was returned.");
          }

          try {
            window.localStorage.setItem("base44_access_token", token);
            window.localStorage.setItem("token", token);
          } catch (e) {}

          window.location.href = fromUrl;
        })
        .catch(function (err) {
          var errMsg = err && err.message ? err.message : "Login failed.";
          
          // Check if error is verification-related
          if (errMsg.toLowerCase().includes("verify") || 
              errMsg.toLowerCase().includes("verification") ||
              errMsg.toLowerCase().includes("confirmed") ||
              errMsg.toLowerCase().includes("not verified")) {
            // Redirect to verification page with email pre-filled
            var verifyPath = basePath === "/frontend/" ? "/frontend/verify" : "/verify";
            var verifyUrl = verifyPath + "?email=" + encodeURIComponent(payload.email) + "&app_id=" + encodeURIComponent(appId);
            window.location.href = verifyUrl;
            return;
          }
          
          if (errorEl) {
            errorEl.textContent = errMsg;
            errorEl.classList.remove("hidden");
          }
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        });
    });
   })();
  </script>
