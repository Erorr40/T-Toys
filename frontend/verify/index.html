<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <script>
   (function () {
    // Base44 SDK reads these values from query params at bootstrap.
    var url = new URL(window.location.href);
    var changed = false;
    if (!url.searchParams.get("app_base_url")) {
     var appBasePath = /^\/frontend(?:\/|$)/.test(window.location.pathname || "/") ? "/frontend" : "";
     url.searchParams.set("app_base_url", window.location.origin + appBasePath);
     changed = true;
    }
    if (changed) {
     window.location.replace(url.toString());
    }
   })();
  </script>
  <link href="assets/toy-logo.svg" rel="icon" type="image/svg+xml"/>
  <script>
   (function () {
    var path = window.location.pathname;
    var base = "/";
    if (path.indexOf("/frontend/") === 0) {
      base = "/frontend/";
    }
    document.write('<base href="' + base + '">');
   })();
  </script>
  <script>
   (function () {
    var path = window.location.pathname;
    if (path.indexOf("/frontend/") === 0) {
      var normalized = path.replace(/^\/frontend/, "") || "/";
      if (normalized === "/index.html") normalized = "/";
      if (normalized.endsWith("/index.html")) normalized = normalized.slice(0, -"index.html".length);
      if (!normalized.endsWith("/") && path.endsWith("/")) normalized += "/";
      window.history.replaceState({}, document.title, normalized + window.location.search + window.location.hash);
    }
   })();
  </script>

  <meta content="strict-origin-when-cross-origin" name="referrer"/>

  <title>
   T for Toys - Verify Account
  </title>
  <link crossorigin="" href="assets/index-C3Qqn4e8.css" rel="stylesheet"/>
  <script async="true" data-app-id="699db9d22942c2facdf17ccb" data-app-name="T for Toys" data-platform-url="https://app.base44.com" src="static/js/badge.js">
  </script>
 </head>
 <body class="min-h-screen bg-[#FFF9F0]">
  <div class="min-h-screen flex items-center justify-center px-4 py-10">
   <div class="w-full max-w-md bg-white rounded-3xl p-6 shadow-lg">
    <div class="text-center mb-6">
     <h1 class="text-3xl font-black text-gray-800">
      Verify Your Email
     </h1>
     <p class="text-sm text-gray-500">
      Enter your email and the verification code we sent you.
     </p>
    </div>
    <form class="space-y-4" id="verify-form">
     <div>
      <label class="block text-sm font-bold text-gray-600 mb-2" for="verify-email">
       Email
      </label>
      <input autocomplete="email" class="w-full px-4 py-3 rounded-2xl border-2 border-gray-100 focus:border-[#FF6B9D] focus:outline-none font-semibold text-gray-800" id="verify-email" required="" type="email"/>
     </div>
     <div>
      <label class="block text-sm font-bold text-gray-600 mb-2" for="verify-code">
       Verification Code
      </label>
      <input autocomplete="off" class="w-full px-4 py-3 rounded-2xl border-2 border-gray-100 focus:border-[#FF6B9D] focus:outline-none font-semibold text-gray-800 tracking-widest text-center" id="verify-code" placeholder="000000" required="" type="text"/>
     </div>
     <p class="hidden text-sm text-red-600 font-semibold" id="verify-error" role="alert">
     </p>
     <button class="w-full py-3 bg-gradient-to-r from-[#FF6B9D] to-[#A78BFA] text-white font-bold rounded-2xl hover:shadow-lg transition-all" id="verify-submit" type="submit">
      Verify & Continue
     </button>
    </form>
    <div class="mt-5 text-center">
     <p class="text-sm text-gray-600">
      Didn't receive a code?
      <a class="font-bold text-[#FF6B9D] hover:underline" href="/login">
       Try Again
      </a>
     </p>
    </div>
   </div>
  </div>
  <script>
   (function () {
    var params = new URLSearchParams(window.location.search);
    var appId = params.get("app_id") || "699db9d22942c2facdf17ccb";
    var apiBase = "https://tots-toy-fun.base44.app/api";
    var basePath = window.location.pathname.indexOf("/frontend/") === 0 ? "/frontend/" : "/";
    function getRoutePath(routeName) {
      return basePath === "/frontend/" ? "/frontend/" + routeName : "/" + routeName;
    }
    
    var prefillEmail = params.get("email");

    var form = document.getElementById("verify-form");
    var emailInput = document.getElementById("verify-email");
    var codeInput = document.getElementById("verify-code");
    var errorEl = document.getElementById("verify-error");
    var submitBtn = document.getElementById("verify-submit");

    if (!form || !emailInput || !codeInput || !submitBtn) return;

    if (prefillEmail) {
      emailInput.value = decodeURIComponent(prefillEmail);
      codeInput.focus();
    }

    // Support a debug_code query param to prefill the verification code for testing
    var debugCode = params.get('debug_code') || params.get('debug');
    if (debugCode) {
      codeInput.value = decodeURIComponent(debugCode);
    }

    // add sign out helper
    var signOutEl = document.createElement('div');
    signOutEl.style.marginTop = '10px';
    signOutEl.style.textAlign = 'center';
    var so = document.createElement('button');
    so.textContent = 'Sign out';
    so.className = 'text-xs text-gray-500 hover:underline';
    so.addEventListener('click', function (e) {
      e.preventDefault();
      var appBase = new URL(window.location.href).searchParams.get('app_base_url') || window.location.origin;
      var logoutPath = getRoutePath("logout");
      window.location.href = logoutPath + '?app_base_url=' + encodeURIComponent(appBase) + '&app_id=' + encodeURIComponent(appId);
    });
    signOutEl.appendChild(so);
    var container = document.querySelector('.min-h-screen .w-full') || document.body;
    if (container) container.parentNode.insertBefore(signOutEl, container.nextSibling);

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      
      var email = String(emailInput.value || "").trim();
      var code = String(codeInput.value || "").trim();

      if (errorEl) {
        errorEl.textContent = "";
        errorEl.classList.add("hidden");
      }

      if (!email || !code) {
        if (errorEl) {
          errorEl.textContent = "Please enter both email and verification code.";
          errorEl.classList.remove("hidden");
        }
        return;
      }

      submitBtn.disabled = true;
      var originalText = submitBtn.textContent;
      submitBtn.textContent = "Verifying...";

      var payload = {
        email: email,
        code: code
      };

      // The Base44 verify endpoint expects a top-level navigation (GET with query params).
      // Redirect the browser instead of using fetch to avoid 405 Method Not Allowed.
      var verifyUrl = apiBase + "/apps/" + encodeURIComponent(appId) + "/auth/verify?email=" + encodeURIComponent(email) + "&code=" + encodeURIComponent(code);
      window.location.href = verifyUrl;
    });
   })();
  </script>
 </body>
</html>
