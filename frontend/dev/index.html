<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <link href="assets/toy-logo.svg" rel="icon" type="image/svg+xml"/>
  <script>
   (function () {
    var path = window.location.pathname;
    var base = "/";
    if (path.indexOf("/frontend/") === 0) {
      base = "/frontend/";
    }
    document.write('<base href="' + base + '">');
   })();
  </script>
  <meta content="strict-origin-when-cross-origin" name="referrer"/>
  <meta content="#fff9f0" name="theme-color"/>
  <meta content="light" name="color-scheme"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta content="https://t-toys.example" name="app-origin"/>
  <meta content="http://t-toysbackend.runasp.net" name="backend-base-url"/>
  <script src="static/js/runtime-config.js">
  </script>
  <title>
   T for Toys - Dev Status
  </title>
  <link crossorigin="" href="assets/index-C3Qqn4e8.css" rel="stylesheet"/>
 </head>
 <body class="min-h-screen bg-[#FFF9F0]">
  <div class="min-h-screen px-4 sm:px-6 py-10">
   <div class="max-w-3xl mx-auto">
    <div class="mb-8">
     <h1 class="text-3xl md:text-4xl font-black text-gray-800">
      Dev Status
     </h1>
     <p class="text-gray-500 mt-2">
      Backend health, ping, and API checks.
     </p>
    </div>
    <div class="bg-white rounded-3xl p-6 shadow-lg mb-6">
     <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
       <p class="text-sm font-bold text-gray-500">
        Backend Base URL
       </p>
       <p class="text-lg font-black text-gray-800" id="backend-url">
       </p>
      </div>
      <div class="text-right">
       <p class="text-xs text-gray-400">
        Last check
       </p>
       <p class="text-sm font-bold text-gray-700" id="last-check">
        Not yet
       </p>
      </div>
     </div>
     <div class="mt-4">
      <button class="px-5 py-2.5 rounded-2xl bg-gradient-to-r from-[#FF6B9D] to-[#A78BFA] text-white font-bold hover:shadow-lg transition-all" id="run-checks">
       Run checks
      </button>
     </div>
    </div>
    <div class="space-y-4" id="status-list">
     <div class="bg-white rounded-3xl p-5 shadow-lg" id="status-health">
      <div class="flex items-center justify-between gap-4">
       <div>
        <p class="font-black text-gray-800">
         GET /health
        </p>
        <p class="text-xs text-gray-400 url">
        </p>
       </div>
       <span class="status px-3 py-1 rounded-full text-xs font-bold bg-gray-100 text-gray-500">
        Pending
       </span>
      </div>
      <p class="details text-sm text-gray-600 mt-3">
      </p>
     </div>
     <div class="bg-white rounded-3xl p-5 shadow-lg" id="status-info">
      <div class="flex items-center justify-between gap-4">
       <div>
        <p class="font-black text-gray-800">
         GET /api/info
        </p>
        <p class="text-xs text-gray-400 url">
        </p>
       </div>
       <span class="status px-3 py-1 rounded-full text-xs font-bold bg-gray-100 text-gray-500">
        Pending
       </span>
      </div>
      <p class="details text-sm text-gray-600 mt-3">
      </p>
     </div>
    <div class="bg-white rounded-3xl p-5 shadow-lg" id="status-db">
      <div class="flex items-center justify-between gap-4">
       <div>
        <p class="font-black text-gray-800">
         GET /api/db/health
        </p>
        <p class="text-xs text-gray-400 url">
        </p>
       </div>
       <span class="status px-3 py-1 rounded-full text-xs font-bold bg-gray-100 text-gray-500">
        Pending
       </span>
      </div>
      <p class="details text-sm text-gray-600 mt-3">
      </p>
     </div>
    </div>
   </div>
  </div>
  <script>
   (function () {
    var statusMap = {
      ok: "bg-[#4ECDC4]/20 text-[#2A9D8F]",
      fail: "bg-[#FF6B9D]/20 text-[#FF6B9D]",
      warn: "bg-[#FFD93D]/30 text-[#D4A800]"
    };

    function getBackendBase() {
      var meta = document.querySelector('meta[name="backend-base-url"]');
      var backend = meta && meta.content ? meta.content.trim() : "";
      try {
        var qs = new URL(window.location.href).searchParams.get("backend_base_url");
        if (qs) backend = qs;
      } catch (e) {}
      if (!backend) backend = window.location.origin;
      return backend.replace(/\/+$/, "");
    }

    function setRow(row, state, label, detail, url, latencyMs) {
      var statusEl = row.querySelector(".status");
      var detailEl = row.querySelector(".details");
      var urlEl = row.querySelector(".url");
      if (urlEl) urlEl.textContent = url;
      if (statusEl) {
        statusEl.className = "status px-3 py-1 rounded-full text-xs font-bold " + (statusMap[state] || statusMap.warn);
        var suffix = typeof latencyMs === "number" ? " (" + latencyMs + " ms)" : "";
        statusEl.textContent = label + suffix;
      }
      if (detailEl) detailEl.textContent = detail || "";
    }

    function formatJson(data) {
      try {
        return JSON.stringify(data);
      } catch (e) {
        return String(data || "");
      }
    }

    function fetchStatus(rowId, path) {
      var row = document.getElementById(rowId);
      var base = getBackendBase();
      var url = base + path;
      if (!row) return Promise.resolve();

      setRow(row, "warn", "Checking", "", url, null);
      var start = performance.now();

      return fetch(url, { cache: "no-store" })
        .then(function (response) {
          var latency = Math.round(performance.now() - start);
          if (!response.ok) {
            setRow(row, "fail", "Fail", "HTTP " + response.status, url, latency);
            return null;
          }
          return response
            .json()
            .then(function (data) {
              setRow(row, "ok", "OK", formatJson(data), url, latency);
            })
            .catch(function () {
              setRow(row, "ok", "OK", "(no JSON body)", url, latency);
            });
        })
        .catch(function (err) {
          setRow(row, "fail", "Fail", err && err.message ? err.message : "Request failed", url, null);
        });
    }

    function runChecks() {
      var backendUrlEl = document.getElementById("backend-url");
      var lastCheckEl = document.getElementById("last-check");
      var base = getBackendBase();
      if (backendUrlEl) backendUrlEl.textContent = base;
      if (lastCheckEl) lastCheckEl.textContent = new Date().toLocaleString();

      return Promise.all([
        fetchStatus("status-health", "/health"),
        fetchStatus("status-info", "/api/info"),
        fetchStatus("status-db", "/api/db/health")
      ]);
    }

    var runBtn = document.getElementById("run-checks");
    if (runBtn) {
      runBtn.addEventListener("click", runChecks);
    }

    runChecks();
   })();
  </script>
 </body>
</html>
