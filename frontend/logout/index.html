<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Signing out...</title>
  <script>
    (function(){
      try { localStorage.removeItem('base44_access_token'); localStorage.removeItem('token'); } catch(e){}
      var params = new URLSearchParams(window.location.search);
      var appId = params.get('app_id') || '699db9d22942c2facdf17ccb';
      var appBase = params.get('app_base_url') || window.location.origin;
      var logoutUrl = 'https://app.base44.com/apps/' + encodeURIComponent(appId) + '/auth/logout?app_base_url=' + encodeURIComponent(appBase);
      var done = false;
      function goHome() {
        if (done) return;
        done = true;
        window.location.replace(appBase || '/');
      }
      setTimeout(goHome, 1200);
      try {
        fetch(logoutUrl, {
          method: 'GET',
          mode: 'no-cors',
          credentials: 'include',
          keepalive: true
        }).finally(goHome);
      } catch (e) {
        goHome();
      }
    })();
  </script>
</head>
<body>
  <p>Signing out…</p>
</body>
</html>
