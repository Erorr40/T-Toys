<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Signing out...</title>
  <script>
    (function(){
      try { localStorage.removeItem('base44_access_token'); localStorage.removeItem('token'); } catch(e){}
      var params = new URLSearchParams(window.location.search);
      var appId = params.get('app_id') || '699db9d22942c2facdf17ccb';
      var appBase = params.get('app_base_url') || window.location.origin;
      // Try platform logout endpoint, fallback to home
      var logoutUrl = 'https://app.base44.com/apps/' + encodeURIComponent(appId) + '/auth/logout?app_base_url=' + encodeURIComponent(appBase);
      // Do a top-level navigation to ensure provider can clear cookies
      window.location.replace(logoutUrl);
      // If navigation fails or returns 404, fall back after timeout
      setTimeout(function(){ window.location.replace(appBase || '/'); }, 3000);
    })();
  </script>
</head>
<body>
  <p>Signing out…</p>
</body>
</html>
