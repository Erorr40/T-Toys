<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <script>
   (function () {
    // Base44 SDK reads these values from query params at bootstrap.
    var url = new URL(window.location.href);
    var changed = false;
    if (!url.searchParams.get("app_base_url")) {
     url.searchParams.set("app_base_url", "https://tots-toy-fun.base44.app");
     changed = true;
    }
    if (changed) {
     window.location.replace(url.toString());
    }
   })();
  </script>
  <link href="assets/toy-logo.svg" rel="icon" type="image/svg+xml"/>
  <script>
   (function () {
    var path = window.location.pathname;
    var base = "/";
    if (path.indexOf("/frontend/") === 0) {
      base = "/frontend/";
    }
    document.write('<base href="' + base + '">');
   })();
  </script>
  <script>
   (function () {
    var path = window.location.pathname;
    if (path.indexOf("/frontend/") === 0) {
      var normalized = path.replace(/^\/frontend/, "") || "/";
      if (normalized === "/index.html") normalized = "/";
      if (normalized.endsWith("/index.html")) normalized = normalized.slice(0, -"index.html".length);
      if (!normalized.endsWith("/") && path.endsWith("/")) normalized += "/";
      window.history.replaceState({}, document.title, normalized + window.location.search + window.location.hash);
    }
   })();
  </script>

  <link href="https://qtrypzzcjebvfcihiynt.supabase.co" rel="dns-prefetch"/>
  <meta content="strict-origin-when-cross-origin" name="referrer"/>
  <meta content="#fff9f0" name="theme-color"/>
  <meta content="light" name="color-scheme"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

  <title>
   T for Toys - Sign Up
  </title>
  <link crossorigin="" href="assets/index-C3Qqn4e8.css" rel="stylesheet"/>
  <script async="true" data-app-id="699db9d22942c2facdf17ccb" data-app-name="T for Toys" data-platform-url="https://app.base44.com" src="static/js/badge.js">
  </script>
 </head>
 <body class="min-h-screen bg-[#FFF9F0]">
  <div class="min-h-screen flex items-center justify-center px-4 py-10">
   <div class="w-full max-w-md bg-white rounded-3xl p-6 shadow-lg">
    <div class="text-center mb-6">
     <h1 class="text-3xl font-black text-gray-800">
      Create Account
     </h1>
     <p class="text-sm text-gray-500">
      Sign up to start shopping and exploring toys!
     </p>
    </div>
    <form class="space-y-4" id="signup-form">
     <div>
      <label class="block text-sm font-bold text-gray-600 mb-2" for="signup-email">
       Email
      </label>
      <input autocomplete="email" class="w-full px-4 py-3 rounded-2xl border-2 border-gray-100 focus:border-[#FF6B9D] focus:outline-none font-semibold text-gray-800" id="signup-email" required="" type="email"/>
     </div>
     <div>
      <label class="block text-sm font-bold text-gray-600 mb-2" for="signup-password">
       Password
      </label>
      <input autocomplete="new-password" class="w-full px-4 py-3 rounded-2xl border-2 border-gray-100 focus:border-[#FF6B9D] focus:outline-none font-semibold text-gray-800" id="signup-password" required="" type="password"/>
     </div>
     <div>
      <label class="block text-sm font-bold text-gray-600 mb-2" for="signup-confirm">
       Confirm Password
      </label>
      <input autocomplete="new-password" class="w-full px-4 py-3 rounded-2xl border-2 border-gray-100 focus:border-[#FF6B9D] focus:outline-none font-semibold text-gray-800" id="signup-confirm" required="" type="password"/>
     </div>
     <p class="hidden text-sm text-red-600 font-semibold" id="signup-error" role="alert">
     </p>
     <button class="w-full py-3 bg-gradient-to-r from-[#FF6B9D] to-[#A78BFA] text-white font-bold rounded-2xl hover:shadow-lg transition-all" id="signup-submit" type="submit">
      Create Account
     </button>
    </form>
    <div class="mt-5 text-center">
     <p class="text-sm text-gray-600">
      Already have an account?
      <a class="font-bold text-[#FF6B9D] hover:underline" href="/login">
       Sign In
      </a>
     </p>
    </div>
   </div>
  </div>
  <script>
   (function () {
    var params = new URLSearchParams(window.location.search);
    var appId = params.get("app_id") || "699db9d22942c2facdf17ccb";
    var apiBase = "https://tots-toy-fun.base44.app/api";
    var basePath = window.location.pathname.indexOf("/frontend/") === 0 ? "/frontend/" : "/";
    var fallbackUrl = window.location.origin + basePath;

    var form = document.getElementById("signup-form");
    var emailInput = document.getElementById("signup-email");
    var passwordInput = document.getElementById("signup-password");
    var confirmInput = document.getElementById("signup-confirm");
    var errorEl = document.getElementById("signup-error");
    var submitBtn = document.getElementById("signup-submit");

    if (!form || !emailInput || !passwordInput || !confirmInput || !submitBtn) return;

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      
      var email = String(emailInput.value || "").trim();
      var password = String(passwordInput.value || "");
      var confirm = String(confirmInput.value || "");

      if (errorEl) {
        errorEl.textContent = "";
        errorEl.classList.add("hidden");
      }

      // Basic validation
      if (!email || !password || !confirm) {
        if (errorEl) {
          errorEl.textContent = "All fields are required.";
          errorEl.classList.remove("hidden");
        }
        return;
      }

      if (password !== confirm) {
        if (errorEl) {
          errorEl.textContent = "Passwords do not match.";
          errorEl.classList.remove("hidden");
        }
        return;
      }

      if (password.length < 6) {
        if (errorEl) {
          errorEl.textContent = "Password must be at least 6 characters.";
          errorEl.classList.remove("hidden");
        }
        return;
      }

      submitBtn.disabled = true;
      var originalText = submitBtn.textContent;
      submitBtn.textContent = "Creating account...";

      var payload = {
        email: email,
        password: password
      };

      fetch(apiBase + "/apps/" + encodeURIComponent(appId) + "/auth/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify(payload)
      })
        .then(function (response) {
          return response.json().then(function (data) {
            return { ok: response.ok, data: data };
          });
        })
        .then(function (result) {
          if (!result.ok) {
            var message = (result.data && (result.data.message || result.data.detail)) || "Registration failed.";
            throw new Error(message);
          }

          var token = result.data && result.data.access_token;
          
          try {
            window.localStorage.setItem("signup_email", email);
          } catch (e) {}

          if (token) {
            try {
              window.localStorage.setItem("base44_access_token", token);
              window.localStorage.setItem("token", token);
            } catch (e) {}
            window.location.href = "/";
          } else {
            // No token returned, redirect to login with pre-filled email
            var loginUrl = "/login?prefill_email=" + encodeURIComponent(email);
            window.location.href = loginUrl;
          }
        })
        .catch(function (err) {
          if (errorEl) {
            errorEl.textContent = err && err.message ? err.message : "Registration failed.";
            errorEl.classList.remove("hidden");
          }
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        });
    });
   })();
  </script>
 </body>
</html>
